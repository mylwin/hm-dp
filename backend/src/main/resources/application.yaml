server:
  port: 8081
spring:
  jmx:
    # 启用后可通过本地 JConsole 手动重建；设为 false 可关闭 JMX 导出。
    enabled: ${SHOP_BLOOM_JMX_ENABLED:true}
  profiles:
    active: dev
  application:
    name: hmdp
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hm-dp}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=60000
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:123456}
      initial-size: 1
      min-idle: 1
      max-active: 20
      max-wait: 5000
      async-init: false
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-on-borrow: true
      test-while-idle: true
      test-on-return: false
      keep-alive: true
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 60000
      time-between-connect-error-millis: 2000
      connection-error-retry-attempts: 5
      break-after-acquire-failure: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:20041223}
      # 受理事务持有请求行锁时调用 Redis，限制连接与单次命令等待时间。
      connect-timeout: 2s
      # 旧 Stream 使用 BLOCK 2000ms，命令超时需留出余量，避免空闲读取被误判为故障。
      timeout: 3s
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com  # 阿里云OSS地址
    access-key-id: ${dev.access-key-id}  # 访问密钥ID
    access-key-secret: ${dev.access-key-secret}  # 访问密钥密钥
    bucket-name: ${dev.bucket-name}  # 桶名

hmdp:
  rocketmq:
    # 第一阶段仅启用客户端；不会将秒杀业务从 Stream 自动切换到 RocketMQ。
    enabled: ${ROCKETMQ_ENABLED:true}
    name-server: ${ROCKETMQ_NAMESERVER:10.211.55.9:9876}  # NameServer服务器地址
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:hmdp-order-producer}    # 生产者组
    order-topic: ${ROCKETMQ_ORDER_TOPIC:hmdp-seckill-order-create}  # 订单主题
    send-timeout: ${ROCKETMQ_SEND_TIMEOUT:3s}  # 发送超时
    send-retries: ${ROCKETMQ_SEND_RETRIES:0}  # 发送重试次数
    vip-channel-enabled: ${ROCKETMQ_VIP_CHANNEL_ENABLED:false}  # 是否启用VIP通道
    access-key: ${ROCKETMQ_ACCESS_KEY:}  # 访问密钥
    secret-key: ${ROCKETMQ_SECRET_KEY:}  # 密钥
    outbox:
      # 第二阶段默认关闭，不扫描尚未执行迁移的业务库。
      enabled: ${ORDER_OUTBOX_ENABLED:false}  # 是否开启 outbox
      batch-size: ${ORDER_OUTBOX_BATCH_SIZE:20}  # 批量处理大小
      poll-interval-ms: ${ORDER_OUTBOX_POLL_INTERVAL_MS:1000}  # 轮询间隔
      lease-ms: ${ORDER_OUTBOX_LEASE_MS:30000}  # 租约时间
  seckill:
    # 只注册新受理组件；当前 HTTP 入口仍走旧 Stream，不提供通道切换。
    reliable-components-enabled: ${SECKILL_RELIABLE_COMPONENTS_ENABLED:false}  # 是否开启可靠组件
    transaction-timeout-seconds: ${SECKILL_TRANSACTION_TIMEOUT_SECONDS:5}  # 事务超时秒数
  cache:
    # 每实例的互斥缓存回源并发上限，启动时生效；不应占满数据库连接池。
    max-concurrent-fallbacks: ${CACHE_MAX_CONCURRENT_FALLBACKS:10}
    shop-bloom:
      # 开启拦截前须确认所有新增入口同步快照，导入数据后应重建。
      enabled: ${SHOP_BLOOM_ENABLED:true}  # 是否开启
      enforce: ${SHOP_BLOOM_ENFORCE:true}  # 是否启用负向拦截，修改后重启生效
      version: ${SHOP_BLOOM_VERSION:v1}  # 版本
      expected-insertions: ${SHOP_BLOOM_EXPECTED_INSERTIONS:100000}  # 预期插入数量
      false-probability: ${SHOP_BLOOM_FALSE_PROBABILITY:0.001}  # 误判概率
      batch-size: ${SHOP_BLOOM_BATCH_SIZE:500}  # 批量处理大小

jwt:
  secret: ${HMDP_JWT_SECRET:${dev.secret:}}  # 优先环境变量，可回退到本地 dev.secret
  issuer: hm-dp  # 签发者
  access-ttl: 2h  # 短期访问令牌，前端自动续签
  refresh-ttl: 7d  # 本次登录的绝对有效期，刷新不延长
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}  # HTTPS 部署设为 true
  clock-skew-seconds: 60  # 令牌有效期容差
